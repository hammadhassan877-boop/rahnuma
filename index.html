<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Rahnuma — Career & Scholarship Coach for Pakistan</title>
<!-- Google tag (gtag.js) -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-KXFF7D1G6T"></script>
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('js', new Date());

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,-apple-system,sans-serif;background:#f5f4f0;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px;gap:12px}
.page-title{font-size:15px;font-weight:500;color:#1a1a1a;text-align:center}
.tools{display:flex;gap:16px;width:100%;max-width:1080px;align-items:flex-start;flex-wrap:wrap;justify-content:center}
.app{width:100%;max-width:520px;background:#fff;border-radius:16px;border:1px solid #e0ddd6;display:flex;flex-direction:column;min-height:600px;overflow:hidden}
.hdr{padding:14px 18px;border-bottom:1px solid #eee;display:flex;align-items:center;gap:10px}
.av{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.av.green{background:#E1F5EE}
.av.blue{background:#E6F1FB}
.hname{font-size:14px;font-weight:600;color:#1a1a1a}
.hsub{font-size:11px;margin-top:2px}
.hsub.green{color:#1D9E75}
.hsub.blue{color:#185FA5}
.badge{display:inline-block;font-size:10px;padding:2px 8px;border-radius:99px;font-weight:500;margin-left:6px;vertical-align:middle;background:#FEF3C7;color:#92400E}
.prog-wrap{height:3px;background:#eee}
.prog-fill{height:3px;transition:width .4s ease;width:0%}
.prog-fill.green{background:#1D9E75}
.prog-fill.blue{background:#185FA5}
.plabel{font-size:10px;color:#888;text-align:right;padding:3px 16px 0}
.chat{flex:1;padding:14px 18px;display:flex;flex-direction:column;gap:8px;overflow-y:auto;max-height:360px}
.b{max-width:86%;padding:10px 14px;border-radius:14px;font-size:13.5px;line-height:1.65;white-space:pre-wrap;word-break:break-word}
.b.bot{background:#f2f1ed;color:#1a1a1a;align-self:flex-start;border-bottom-left-radius:3px}
.b.user-green{background:#1D9E75;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.b.user-blue{background:#185FA5;color:#fff;align-self:flex-end;border-bottom-right-radius:3px}
.b.err{background:#fff0f0;color:#7a2020;align-self:flex-start;border-bottom-left-radius:3px;font-size:12.5px;border:1px solid #fcc}
.dots{display:inline-flex;gap:4px;align-items:center}
.dots span{width:6px;height:6px;border-radius:50%;background:#aaa;animation:bounce .9s infinite}
.dots span:nth-child(2){animation-delay:.18s}.dots span:nth-child(3){animation-delay:.36s}
@keyframes bounce{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
.qrs{padding:0 18px 10px;display:flex;flex-wrap:wrap;gap:7px}
.qr.green{font-size:12px;padding:7px 14px;border-radius:99px;border:1.5px solid #1D9E75;color:#1D9E75;background:transparent;cursor:pointer;transition:all .12s;font-family:inherit}
.qr.green:hover{background:#1D9E75;color:#fff}
.qr.blue{font-size:12px;padding:7px 14px;border-radius:99px;border:1.5px solid #185FA5;color:#185FA5;background:transparent;cursor:pointer;transition:all .12s;font-family:inherit}
.qr.blue:hover{background:#185FA5;color:#fff}
.irow{padding:12px 18px;border-top:1px solid #eee;display:flex;gap:8px}
.irow input{flex:1;border:1px solid #ddd;border-radius:99px;padding:9px 16px;font-size:13.5px;font-family:inherit;color:#1a1a1a;background:#fff;outline:none}
.irow input:focus{border-color:#1D9E75}
.irow input.blue:focus{border-color:#185FA5}
.send{width:38px;height:38px;border-radius:50%;border:none;color:#fff;cursor:pointer;font-size:17px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.send.green{background:#1D9E75}
.send.blue{background:#185FA5}
.send:disabled{opacity:.35;cursor:not-allowed}
.footer{font-size:12px;color:#888;text-align:center}
</style>
</head>
<body>
<p class="page-title">🧭 Rahnuma — Built for Pakistan's Graduates</p>

<div class="tools">

  <!-- CAREER COACH -->
  <div class="app">
    <div class="hdr">
      <div class="av green">🧭</div>
      <div>
        <div class="hname">Rahnuma — Career Coach</div>
        <div class="hsub green">Find your career path · PKR salaries</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-fill green" id="c-prog"></div></div>
    <div class="plabel" id="c-plabel">Getting to know you</div>
    <div class="chat" id="c-chat"></div>
    <div class="qrs" id="c-qrs"></div>
    <div class="irow">
      <input id="c-inp" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')cSend()"/>
      <button class="send green" id="c-sbtn" onclick="cSend()">➤</button>
    </div>
  </div>

  <!-- SCHOLARSHIP COACH -->
  <div class="app">
    <div class="hdr">
      <div class="av blue">🎓</div>
      <div>
        <div class="hname">Rahnuma — Scholarship Coach <span class="badge">New</span></div>
        <div class="hsub blue">Local & International scholarships</div>
      </div>
    </div>
    <div class="prog-wrap"><div class="prog-fill blue" id="s-prog"></div></div>
    <div class="plabel" id="s-plabel">Getting to know you</div>
    <div class="chat" id="s-chat"></div>
    <div class="qrs" id="s-qrs"></div>
    <div class="irow">
      <input id="s-inp" class="blue" placeholder="Type your answer…" onkeydown="if(event.key==='Enter')sSend()"/>
      <button class="send blue" id="s-sbtn" onclick="sSend()">➤</button>
    </div>
  </div>

</div>

<p class="footer">Made with ❤️ for Pakistan</p>

<script>
const SHEETS_URL='https://script.google.com/macros/s/AKfycby9u2tq6RYRqWEklkPu11Tvme3qS0m3XjdvblQmlV948qTD8VtRSZ6IgamN-7mIX3ok/exec';
  const S_SHEETS_URL='https://script.google.com/macros/s/AKfycbw1vB2dnGQJOhDHmsCpGhaDkZoWHL-jEjpT8oqR2nEmini5HCFRS7SlAF6gGzrEr_PMzA/exec';

const C_SYSTEM=`You are Rahnuma, a warm and direct AI career coach for Pakistani graduates. Always give salaries in PKR/month. Reference real Pakistani employers: Systems Ltd, NetSol, HBL, Jazz, Telenor, Daraz, 10Pearls, Rozee.pk, Upwork, NIC Islamabad. Acknowledge family pressure and location constraints. Never say "follow your passion" — be specific. Mirror the user's language (Urdu/English/mixed). Never use any markdown formatting. No ** for bold, no # for headers, no * for bullets. Use CAPS for path names like PATH 1, PATH 2, PATH 3. Separate sections with blank lines only. For each career path: day-to-day reality in Pakistan, entry salary PKR/month, where to find jobs, one free resource, one "start this week" action.`;

const C_STEPS=[
  {key:'degree',prog:12,label:'Getting to know you',q:"Assalam o Alaikum! I'm Rahnuma — your career guide built for Pakistan.\n\nI'll ask you 5 quick questions, then give you 3 real career paths with PKR salaries.\n\nWhat's your degree and when did you graduate (or expect to)?",qr:null},
  {key:'strengths',prog:30,label:'Finding your strengths',q:"Got it. Forget your degree for a second.\n\nWhat do people actually come to you for? What feels easy to you but hard for others?",qr:["Explaining things clearly","Organizing and planning","Solving technical problems","Understanding people","Building or making things","Working with numbers or data","Writing and communicating"]},
  {key:'constraint',prog:50,label:'Understanding your situation',q:"What's your biggest constraint right now? Be honest.",qr:["Need income as soon as possible","Can't relocate from my city","Family expects a specific career","I don't know where to start","Too many interests, can't choose"]},
  {key:'energy',prog:70,label:'Finding your fit',q:"What kind of work gives you energy? Go with your gut.",qr:["Working with people and teams","Analyzing data and problems","Building products or systems","Leading and managing","Writing and communicating","Creative and design work"]},
  {key:'income',prog:86,label:'Almost there',q:"Last one — what monthly income in PKR would make you feel stable right now?",qr:["Under PKR 50,000","PKR 50,000 – 80,000","PKR 80,000 – 150,000","PKR 150,000+","Growth matters more than income right now"]}
];

const S_SYSTEM=`You are Rahnuma Scholarship Coach, a warm and knowledgeable guide helping Pakistani bachelor's degree students and recent graduates find scholarships. You know both local Pakistani scholarships (HEC, Ehsaas, PEEF, Punjab Educational Endowment Fund, Aga Khan Foundation, Fulbright Pakistan) and international ones (Chevening, DAAD, Erasmus, Commonwealth, Obama Foundation, USAID). Always give specific deadlines, eligibility criteria, required documents, and step by step application guidance. Be realistic about competition and requirements. Mirror the user's language (Urdu/English/mixed). Never use markdown formatting. Use CAPS for scholarship names. Give practical Pakistani context — how to get documents attested, HEC equivalence, embassy processes. For each scholarship give: eligibility, deadline, required documents, application steps, and one tip to make the application stronger.`;

const S_STEPS=[
  {key:'semester',prog:12,label:'Getting to know you',q:"Assalam o Alaikum! I'm Rahnuma Scholarship Coach — your guide to finding the right scholarship.\n\nThis tool is designed for bachelor's degree students and recent graduates.\n\nWhat semester are you in, or have you recently graduated?",qr:["1st Semester","2nd Semester","3rd Semester","4th Semester","5th Semester","6th Semester","7th Semester","Final Semester","Recently Graduated"]},
  {key:'age',prog:22,label:'Getting to know you',q:"What is your age? Some scholarships have age limits so this helps filter the right ones for you.",qr:["Under 20","20-22","23-25","26-28","29-35","Above 35"]},
  {key:'degree',prog:35,label:'Your academic background',q:"What is your degree and field of study?",qr:["Engineering / Technology","Business / Management","Social Sciences / Education","Medical / Health Sciences","Arts / Humanities","Law","Computer Science / IT","Natural Sciences"]},
  {key:'cgpa',prog:48,label:'Your academic background',q:"What is your current CGPA or grade? Be honest — this helps match you to realistic scholarships.",qr:["Below 2.5","2.5 – 3.0","3.0 – 3.5","3.5 – 4.0","Don't know yet"]},
  {key:'financial',prog:60,label:'Understanding your situation',q:"Do you have financial need? Many scholarships prioritize students from low or middle income backgrounds.",qr:["Yes — financial support is important","No — I am looking for merit based scholarships","Both are fine"]},
  {key:'destination',prog:72,label:'Finding your fit',q:"Where would you like to study or get funding?",qr:["Pakistan only","United Kingdom","United States","Germany","Any European country","Any country — just find me the best fit"]},
  {key:'goal',prog:84,label:'Almost there',q:"What is your goal after the scholarship?",qr:["Further studies / Research","Professional career growth","Start something / Entrepreneurship","Serve Pakistan / Public sector","Not sure yet"]},
  {key:'achievements',prog:93,label:'Last question',q:"Any achievements that strengthen your application? Select all that apply or describe freely.",qr:["Strong academic record","Community service / Volunteering","Leadership roles","Research or publications","Sports or arts","No major achievements yet"]}
];

let cStep=0,cProfile={},cHistory=[],cBusy=false;
let sStep=0,sProfile={},sHistory=[],sBusy=false;

function addBubble(chatId,cls,text){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');
  d.className='b '+cls;d.textContent=text;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addTyping(chatId,tid){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');
  d.id=tid;d.className='b bot';
  d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function rmTyping(tid){const t=document.getElementById(tid);if(t)t.remove();}

function setProg(pid,lid,pct,lbl){
  document.getElementById(pid).style.width=pct+'%';
  document.getElementById(lid).textContent=lbl;
}

function showQRs(zid,color,opts,fn){
  const z=document.getElementById(zid);z.innerHTML='';
  if(!opts)return;
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='qr '+color;b.textContent=o;
    b.onclick=()=>{z.innerHTML='';fn(o);};
    z.appendChild(b);
  });
}

async function callAPI(history,system){
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:history,system})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'HTTP '+res.status);
  if(!data.text)throw new Error('Empty response');
  return data.text;
}

async function cGo(text){
  if(!text.trim()||cBusy)return;
  cBusy=true;document.getElementById('c-sbtn').disabled=true;
  document.getElementById('c-inp').value='';document.getElementById('c-qrs').innerHTML='';
  addBubble('c-chat','user-green',text);
  if(cStep<C_STEPS.length){cProfile[C_STEPS[cStep].key]=text;cStep++;}
  if(cStep<C_STEPS.length){
    await new Promise(r=>setTimeout(r,350));
    const s=C_STEPS[cStep];
    setProg('c-prog','c-plabel',s.prog,s.label);
    addBubble('c-chat','bot',s.q);
    showQRs('c-qrs','green',s.qr,cGo);
  } else {
    const first=(cStep===C_STEPS.length);if(first)cStep++;
    setProg('c-prog','c-plabel',100,'Your career paths');
    addTyping('c-chat','c-typing');
    if(first){
      fetch(SHEETS_URL,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({degree:cProfile.degree,strengths:cProfile.strengths,constraint:cProfile.constraint,energy:cProfile.energy,income:cProfile.income})
      });
    }

    const payload=first
      ?`User profile:\n• Degree: ${cProfile.degree}\n• Strengths: ${cProfile.strengths}\n• Constraint: ${cProfile.constraint}\n• Work preference: ${cProfile.energy}\n• Income target: ${cProfile.income}\n\nGive 3 specific career paths for Pakistan. For each: day-to-day reality, entry salary PKR/month, where to find jobs in Pakistan, one free resource, one "start this week" action. Be specific and warm. Use CAPS for PATH 1, PATH 2, PATH 3 headers.`
      :text;
    try{
      cHistory.push({role:'user',content:payload});
      const reply=await callAPI(cHistory,C_SYSTEM);
      cHistory.push({role:'assistant',content:reply});
      rmTyping('c-typing');
      addBubble('c-chat','bot',reply);
      if(first)setTimeout(()=>addBubble('c-chat','bot','Questions about any of these? Want me to go deeper? Just ask.'),700);
    }catch(e){
      rmTyping('c-typing');
      addBubble('c-chat','err','Error: '+e.message+'\n\nRefresh and try again.');
    }
  }
  cBusy=false;document.getElementById('c-sbtn').disabled=false;
}
function cSend(){cGo(document.getElementById('c-inp').value.trim());}

async function sGo(text){
  if(!text.trim()||sBusy)return;
  sBusy=true;document.getElementById('s-sbtn').disabled=true;
  document.getElementById('s-inp').value='';document.getElementById('s-qrs').innerHTML='';
  addBubble('s-chat','user-blue',text);
  if(sStep<S_STEPS.length){sProfile[S_STEPS[sStep].key]=text;sStep++;}
  if(sStep<S_STEPS.length){
    await new Promise(r=>setTimeout(r,350));
    const s=S_STEPS[sStep];
    setProg('s-prog','s-plabel',s.prog,s.label);
    addBubble('s-chat','bot',s.q);
    showQRs('s-qrs','blue',s.qr,sGo);
  } else {
    const first=(sStep===S_STEPS.length);if(first)sStep++;
    setProg('s-prog','s-plabel',100,'Your scholarship roadmap');
    addTyping('s-chat','s-typing');
    const payload=first
      ?`Student profile:\n• Semester/Status: ${sProfile.semester}\n• Age: ${sProfile.age}\n• Degree & Field: ${sProfile.degree}\n• CGPA: ${sProfile.cgpa}\n• Financial need: ${sProfile.financial}\n• Preferred destination: ${sProfile.destination}\n• Goal: ${sProfile.goal}\n• Achievements: ${sProfile.achievements}\n\nGive 3 specific scholarships this student can realistically apply for. For each: full name, eligibility, deadline, required documents, step by step application process, and one tip to strengthen the application. Be specific, warm, and realistic about Pakistan's context.`
      :text;
    try{
      sHistory.push({role:'user',content:payload});
      const reply=await callAPI(sHistory,S_SYSTEM);
      sHistory.push({role:'assistant',content:reply});
      rmTyping('s-typing');
      addBubble('s-chat','bot',reply);
      if(first)setTimeout(()=>addBubble('s-chat','bot','Questions about any scholarship? Want step by step help with your application? Just ask.'),700);
    }catch(e){
      rmTyping('s-typing');
      addBubble('s-chat','err','Error: '+e.message+'\n\nRefresh and try again.');
    }
  }
  sBusy=false;document.getElementById('s-sbtn').disabled=false;
}
function sSend(){sGo(document.getElementById('s-inp').value.trim());}

(function(){
  const cs=C_STEPS[0];
  setProg('c-prog','c-plabel',cs.prog,cs.label);
  setTimeout(()=>{addBubble('c-chat','bot',cs.q);showQRs('c-qrs','green',cs.qr,cGo);},200);
  const ss=S_STEPS[0];
  setProg('s-prog','s-plabel',ss.prog,ss.label);
  setTimeout(()=>{addBubble('s-chat','bot',ss.q);showQRs('s-qrs','blue',ss.qr,sGo);},200);
})();
</script>
</body>
</html>
