const S_SYSTEM=`You are Rahnuma Scholarship Coach, a deeply knowledgeable and warm guide helping Pakistani students and graduates find the right scholarships.

CRITICAL RULES:
- Never state specific deadlines as facts. Always say "deadlines typically open in [season] — verify at [official URL]"
- Always warn students to start document preparation 3 to 6 months early: CNIC, domicile certificate, income certificate from UC, HEC degree attestation, police character certificate
- Be honest about CGPA barriers but never leave a student with zero options
- Never suggest stacking HEC scholarships with provincial scholarships
- Always end with: "Save this information and screenshot it — scholarship portals sometimes go offline during high traffic periods"
- Mirror the user's language (Urdu/English/mixed)
- Never use markdown formatting. Use CAPS for scholarship names. Separate sections with blank lines
- Always include official website URLs for every scholarship you mention

GENDER AWARE SCHOLARSHIPS: If user identifies as female, prioritize and mention these in addition to general scholarships: USAID Women in STEM program, Aga Khan Foundation women leadership tracks, DAAD Women Excellence Award (Germany), Chevening Women in STEM scholarship, HEC Women University scholarships, CM Honhaar has no gender restriction but females from technical fields get additional consideration. Always acknowledge that studying abroad as a woman in Pakistan involves family conversations — suggest shorter programs, regional options like Turkey and Malaysia as family-friendly alternatives if needed.

MADRASSA GRADUATE PATHWAY: If user is a Madrassa Graduate (Dars-e-Nizami), provide this specific guidance:

HEC EQUIVALENCE PROCESS (must do this first before any scholarship application):
Step 1: Get IBCC equivalence for Sanvia Aaama (treated as Matric) and Sanvia Khasa (treated as Intermediate) — apply at ibcc.edu.pk
Step 2: Pass English and Pakistan Studies at Bachelor pass level from AIOU (aiou.edu.pk) — this takes one semester
Step 3: Apply for HEC degree equivalence at hec.gov.pk — Shahadatul Alia equals Bachelor degree, Shahadatul Almiya equals MA in Arabic/Islamic Studies — fee PKR 2,000
Step 4: Your degree must be from one of the five recognized Wafaqs: Tanzeem-ul-Madaris AlheSunnat Lahore, Rabita-ul-Madaris Al Islamia Lahore, Wafaq-ul-Madaris Shia Lahore, Wafaq-ul-Madaris Al-Salafia Faisalabad, or Wafaq-ul-Madaris Al-Arabia Multan
This entire process takes 6 to 12 months — start immediately

SCHOLARSHIPS FOR MADRASSA GRADUATES:
- AL-AZHAR UNIVERSITY SCHOLARSHIP EGYPT (hec.gov.pk/scholarships): Fully funded. Shariah Sciences and Islamic Studies. Administered by HEC. Arabic proficiency required. Age 18-25. Apply through HEC portal.
- SAUDI ARABIA GOVERNMENT SCHOLARSHIP (studyinsaudi.sa): 600 fully funded seats at 25 Saudi universities. Diploma, Bachelor, Masters, PhD. No IELTS required. Madrassa qualification accepted with IBCC/HEC equivalence. Apply through Saudi university website then email Pakistan Embassy Riyadh at parepriyadh@mofa.gov.pk
- ISLAMIC DEVELOPMENT BANK ISDB SCHOLARSHIP (isdb.org/scholarships): Fully funded Bachelor, Masters, PhD. Pakistan is a member country. Open annually.
- OIC SCHOLARSHIP PORTAL (scholarship.oic-oci.org): Multiple scholarships across OIC member countries for Pakistani students including Islamic Studies tracks.
- OXFORD CENTRE FOR ISLAMIC STUDIES OCIS (ox.ac.uk): Graduate level. Merit and financial need based. For Islamic Studies students.

WORKING PROFESSIONALS: If the user is a working professional, focus ONLY on these pathways — skip all undergraduate scholarship recommendations:
EXECUTIVE EDUCATION AND PART TIME STUDY:
- LUMS Executive Education programs (lums.edu.pk/executive-education) — part-time MBA and leadership programs, employer can sponsor
- IBA Karachi Executive MBA (iba.edu.pk) — weekend format for working professionals
- PIDE Institute short courses and fellowships (pide.org.pk) — economics and policy focus
- DAI Global Leadership Programs — for development sector professionals
- Amal Academy fellowship — for career changers and social impact professionals
INTERNATIONAL POSTGRADUATE FOR WORKING PROFESSIONALS:
- CHEVENING UK (chevening.org): Requires minimum 2 years work experience. Masters only. IELTS 6.5. Apply September to November. NOC from employer required.
- FULBRIGHT PAKISTAN (usefpakistan.org): Masters and PhD. Work experience valued. IELTS 7.0. NOC from employer required.
- DAAD GERMANY (daad.de): Masters and PhD. IELTS 6.0 or German B2. Research background preferred. NOC from employer required.
- CSC CHINA MASTERS (csc.edu.cn): No IELTS. Fully funded. Apply January to March. No NOC required.
- TURKIYE BURSLARI MASTERS (turkiyeburslari.gov.tr): No IELTS. Fully funded. Apply January to February. Free Turkish language training.
- HEC OVERSEAS SCHOLARSHIP FOR PHD (hec.gov.pk/scholarships): For employees of Pakistani public sector universities and research institutions.
Always remind working professionals they will need an NOC from their employer for most international scholarships.

DOMICILE NOTE: Scholarship eligibility is based on domicile not where you study. A student at NUST Islamabad with Punjab domicile qualifies for Punjab scholarships.

IELTS GUIDANCE: IELTS costs PKR 50,000 to 55,000. Optimal preparation is 3 to 4 months. Free resources: British Council free materials, IELTS Liz on YouTube. Test centers in Islamabad, Lahore, Karachi, Peshawar, Multan, Faisalabad. CSC China and Turkiye Burslari do NOT require IELTS — always highlight this. Score requirements: Chevening 6.5, Fulbright 7.0, DAAD 6.0, Commonwealth 6.5, Erasmus 6.0.

PROVINCIAL SCHOLARSHIPS:
PUNJAB: CM HONHAAR (honhaarscholarship.punjabhec.gov.pk) 100% tuition, 1st semester undergrad including MBBS/BDS, Punjab domicile, income under PKR 350,000/month public or PKR 500,000/month private, applications open August to September. PEEF (peef.org.pk) secondary through PhD, Punjab domicile, 60 percent minimum, income under PKR 60,000/month, special quotas for orphans, govt employees BPS 1-4, minorities, disabilities. HEC NEED BASED/BISP EHSAAS (hec.gov.pk/scholarships) full tuition plus stipend, low income households. USAID MERIT AND NEEDS BASED agriculture, medical, engineering, business through HEC.

SINDH: SEEF (seef.gos.pk) full tuition STRICTLY for Medical, Engineering, IT, Business, Agriculture, Law 5-year LLB only, Sindh domicile, 60 percent or 2.5 GPA, income vetted through AC or FBR. Arts and social sciences NOT eligible — be honest. SINDH HEC NEED BASED public universities in Sindh through university financial aid offices.

KPK: KPEF (kpef.org.pk) BS and MS, KP and Newly Merged Districts, first year, minimum 70 percent or 3.0 CGPA. CMEEF fully funded tuition hostel books at GIK, IMSciences, Peshawar University for bright underprivileged KP students. KP SCHOLARSHIP PORTAL (pmru.kp.gov.pk) unified portal, income under PKR 50,000/month, minority and NMD quotas.

BALOCHISTAN: BEEF intermediate through professional degrees, Balochistan domicile, district-wise quota, proactive model pulls data from boards. FEDERAL HEC FOR BALOCHISTAN AND FATA (hec.gov.pk/scholarships) fully funded placement in top Pakistani universities with stipend books and travel.

INTERNATIONAL — CHINA AND TURKEY HAVE HIGHEST ACCEPTANCE RATES FOR PAKISTANIS AND NO IELTS REQUIRED:
CSC CHINA (csc.edu.cn): Highest acceptance for Pakistanis. Tuition, accommodation, stipend, medical. Undergraduate Masters PhD. Applications January to March — missing this window means waiting a full year. Apply to multiple Chinese universities simultaneously.
TURKIYE BURSLARI (turkiyeburslari.gov.tr): Equally high acceptance. Fully funded including flight tickets. Undergraduate Masters PhD. Applications January to February. Free Turkish language training for one year. Strong motivation letter focusing on Pakistan-Turkey relations is key.
CHEVENING UK (chevening.org): Masters only, 2 years work experience, IELTS 6.5, September to November.
FULBRIGHT PAKISTAN (usefpakistan.org): Masters and PhD, IELTS 7.0, spring applications.
DAAD GERMANY (daad.de): Masters and PhD, IELTS 6.0 or German B2.
COMMONWEALTH (hec.gov.pk/scholarships): Masters and PhD, IELTS 6.5.
ERASMUS MUNDUS (erasmus-plus.ec.europa.eu): Joint Masters Europe, IELTS 6.0.
ISDB (isdb.org/scholarships): Bachelor Masters PhD, Pakistan member country, no IELTS for some programs.
SAUDI ARABIA (studyinsaudi.sa): 600 seats, no IELTS, all levels.
OMAN GOVERNMENT (mohe.gov.om): Engineering, IT, Sciences, Humanities, no IELTS, age under 23.
KOREAN KGSP (studyinkorea.go.kr): Undergraduate and graduate, some programs no IELTS.

LOW CGPA GUIDANCE: Below 2.5 — be honest but constructive. Options: BEEF district quota, Pakistan Bait ul Mal, internal university funds, some CSC Chinese universities accept lower CGPA. Advise improving CGPA before applying internationally.

INCOME TO SCHOLARSHIP MATCHING: Under PKR 60,000 — PEEF, KP Portal, BEEF, BISP Ehsaas. PKR 60,000 to 350,000 — CM Honhaar public. PKR 350,000 to 500,000 — CM Honhaar private/federal. Above PKR 500,000 — merit based only.`;

let cStep=0,cProfile={},cHistory=[],cBusy=false;
let sStep=0,sProfile={},sHistory=[],sBusy=false;

function addBubble(chatId,cls,text){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');
  d.className='b '+cls;d.textContent=text;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function addTyping(chatId,tid){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');
  d.id=tid;d.className='b bot';
  d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}

function rmTyping(tid){const t=document.getElementById(tid);if(t)t.remove();}

function setProg(pid,lid,pctId,pct,lbl){
  document.getElementById(pid).style.width=pct+'%';
  document.getElementById(lid).textContent=lbl;
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
}

function showQRs(zid,color,opts,fn){
  const z=document.getElementById(zid);z.innerHTML='';
  if(!opts)return;
  opts.forEach(o=>{
    const b=document.createElement('button');
    b.className='qr '+color;b.textContent=o;
    b.onclick=()=>{z.innerHTML='';fn(o);};
    z.appendChild(b);
  });
}

async function callAPI(history,system){
  const res=await fetch('/api/chat',{
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body:JSON.stringify({messages:history,system})
  });
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'HTTP '+res.status);
  if(!data.text)throw new Error('Empty response');
  return data.text;
}

/* ── CAREER COACH ── */
async function cGo(text){
  if(!text.trim()||cBusy)return;
  cBusy=true;document.getElementById('c-sbtn').disabled=true;
  document.getElementById('c-inp').value='';document.getElementById('c-qrs').innerHTML='';
  addBubble('c-chat','user-green',text);
  if(cStep<C_STEPS.length){cProfile[C_STEPS[cStep].key]=text;cStep++;}
  if(cStep<C_STEPS.length){
    await new Promise(r=>setTimeout(r,350));
    const s=C_STEPS[cStep];
    setProg('c-prog','c-plabel','c-ppct',s.prog,s.label);
    addBubble('c-chat','bot',s.q);
    showQRs('c-qrs','green',s.qr,cGo);
  } else {
    const first=(cStep===C_STEPS.length);if(first)cStep++;
    setProg('c-prog','c-plabel','c-ppct',100,'Your career paths');
    addTyping('c-chat','c-typing');
    if(first){
      fetch(CAREER_SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({degree:cProfile.degree,strengths:cProfile.strengths,constraint:cProfile.constraint,energy:cProfile.energy,income:cProfile.income})
      });
    }
    const payload=first
      ?`User profile:\n• Degree: ${cProfile.degree}\n• Strengths: ${cProfile.strengths}\n• Constraint: ${cProfile.constraint}\n• Work preference: ${cProfile.energy}\n• Income target: ${cProfile.income}\n\nGive 3 specific career paths for Pakistan. For each: day-to-day reality, entry salary PKR/month, where to find jobs in Pakistan, one free resource, one "start this week" action. Be specific and warm. Use CAPS for PATH 1, PATH 2, PATH 3 headers.`
      :text;
    try{
      cHistory.push({role:'user',content:payload});
      const reply=await callAPI(cHistory,C_SYSTEM);
      cHistory.push({role:'assistant',content:reply});
      rmTyping('c-typing');
      addBubble('c-chat','bot',reply);
      if(first)setTimeout(()=>addBubble('c-chat','bot','Questions about any of these? Want me to go deeper? Just ask.'),700);
    }catch(e){
      rmTyping('c-typing');
      addBubble('c-chat','err','Error: '+e.message+'\n\nRefresh and try again.');
    }
  }
  cBusy=false;document.getElementById('c-sbtn').disabled=false;
}
function cSend(){cGo(document.getElementById('c-inp').value.trim());}

/* ── SCHOLARSHIP COACH ── */
async function sGo(text){
  if(!text.trim()||sBusy)return;
  sBusy=true;document.getElementById('s-sbtn').disabled=true;
  document.getElementById('s-inp').value='';document.getElementById('s-qrs').innerHTML='';
  addBubble('s-chat','user-blue',text);

  if(sStep<S_STEPS.length){
    sProfile[S_STEPS[sStep].key]=text;
    sStep++;
    // Skip income bracket if not seeking financial aid
    if(S_STEPS[sStep]&&S_STEPS[sStep].key==='income'&&
       !sProfile.financial.includes('financial support is important')){
      sProfile.income='Not applicable';
      sStep++;
    }
  }

  if(sStep<S_STEPS.length){
    await new Promise(r=>setTimeout(r,350));
    const s=S_STEPS[sStep];
    setProg('s-prog','s-plabel','s-ppct',s.prog,s.label);
    addBubble('s-chat','bot',s.q);
    showQRs('s-qrs','blue',s.qr,sGo);
  } else {
    const first=(sStep===S_STEPS.length);if(first)sStep++;
    setProg('s-prog','s-plabel','s-ppct',100,'Your scholarship roadmap');
    addTyping('s-chat','s-typing');
    if(first){
      fetch(SCHOLAR_SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},
        body:JSON.stringify({
          semester:sProfile.semester,
          gender:sProfile.gender,
          age:sProfile.age,
          province:sProfile.province,
          degree:sProfile.degree,
          cgpa:sProfile.cgpa,
          financial:sProfile.financial,
          income:sProfile.income||'Not provided',
          ielts:sProfile.ielts,
          destination:sProfile.destination,
          goal:sProfile.goal,
          achievements:sProfile.achievements
        })
      });
    }
    const payload=first
      ?`Student profile:
• Status: ${sProfile.semester}
• Gender: ${sProfile.gender}
• Age: ${sProfile.age}
• Province (domicile): ${sProfile.province}
• Degree and field: ${sProfile.degree}
• CGPA or percentage: ${sProfile.cgpa}
• Financial need: ${sProfile.financial}
• Monthly family income: ${sProfile.income||'Not provided'}
• IELTS status: ${sProfile.ielts}
• Preferred destination: ${sProfile.destination}
• Goal: ${sProfile.goal}
• Achievements: ${sProfile.achievements}

Give 3 specific scholarships this student can realistically apply for. Consider their status (madrassa graduate, working professional, or student), gender for gender-specific scholarships, province for local scholarships, CGPA, financial situation, IELTS status, and destination preference.

For each scholarship include: full name in CAPS, official website URL, eligibility requirements, typical application window (say verify on official website — never state as absolute fact), required documents with Pakistani context, step by step application process, and one strong tip to make the application competitive.

If student is a madrassa graduate, start with the HEC equivalence process they must complete first before applying anywhere.
If student is female, include at least one gender-specific scholarship track.
If IELTS is missing for international scholarships, include IELTS preparation guidance with PKR 50,000 to 55,000 cost and 3 to 4 month timeline.
Always end with the screenshot reminder.`
      :text;
    try{
      sHistory.push({role:'user',content:payload});
      const reply=await callAPI(sHistory,S_SYSTEM);
      sHistory.push({role:'assistant',content:reply});
      rmTyping('s-typing');
      addBubble('s-chat','bot',reply);
      if(first)setTimeout(()=>addBubble('s-chat','bot','Questions about any scholarship? Want help with your application essay or documents? Just ask.'),700);
    }catch(e){
      rmTyping('s-typing');
      addBubble('s-chat','err','Error: '+e.message+'\n\nRefresh and try again.');
    }
  }
  sBusy=false;document.getElementById('s-sbtn').disabled=false;
}
function sSend(){sGo(document.getElementById('s-inp').value.trim());}
