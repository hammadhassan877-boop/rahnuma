LOCAL: LUMS Executive Education (lums.edu.pk/executive-education), IBA Executive MBA (iba.edu.pk), PIDE fellowships (pide.org.pk), DAI Leadership Programs, Amal Academy fellowship.
INTERNATIONAL: CHEVENING (chevening.org) 2 years experience IELTS 6.5. FULBRIGHT (usefpakistan.org) IELTS 7.0. DAAD (daad.de) IELTS 6.0. CSC CHINA (csc.edu.cn) no IELTS January to March. TURKIYE BURSLARI (turkiyeburslari.gov.tr) no IELTS January to February. HEC OVERSEAS PHD (hec.gov.pk/scholarships).

PROVINCIAL: PUNJAB: CM HONHAAR (honhaarscholarship.punjabhec.gov.pk) 100% tuition 1st semester Punjab domicile income under 350K public 500K private August to September. PEEF (peef.org.pk) secondary through PhD Punjab domicile 60 percent income under 60K. BISP EHSAAS (hec.gov.pk/scholarships) full tuition plus stipend.
SINDH: SEEF (seef.gos.pk) Medical Engineering IT Business Agriculture Law only Sindh domicile 60 percent Arts NOT eligible.
KPK: KPEF (kpef.org.pk) first year 70 percent or 3.0. CMEEF fully funded GIK IMSciences Peshawar. KP PORTAL (pmru.kp.gov.pk) income under 50K.
BALOCHISTAN: BEEF district quota proactive model. HEC BALOCHISTAN FATA (hec.gov.pk/scholarships) fully funded placement with stipend.

INTERNATIONAL — CHINA AND TURKEY HIGHEST ACCEPTANCE NO IELTS:
CSC CHINA (csc.edu.cn) January to March apply multiple universities.
TURKIYE BURSLARI (turkiyeburslari.gov.tr) January to February free Turkish training.
CHEVENING (chevening.org). FULBRIGHT (usefpakistan.org). DAAD (daad.de). COMMONWEALTH (hec.gov.pk/scholarships). ERASMUS (erasmus-plus.ec.europa.eu). ISDB (isdb.org/scholarships). SAUDI ARABIA (studyinsaudi.sa) no IELTS 600 seats. OMAN (mohe.gov.om) no IELTS age under 23. KGSP KOREA (studyinkorea.go.kr).

/* ── HELPERS ── */
function addBubble(chatId,cls,text){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');
  d.className='b '+cls;d.textContent=text;
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function addTyping(chatId,tid){
  const c=document.getElementById(chatId);
  const d=document.createElement('div');d.id=tid;d.className='b bot';
  d.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  c.appendChild(d);c.scrollTop=c.scrollHeight;
}
function rmTyping(tid){const t=document.getElementById(tid);if(t)t.remove();}
function setProg(pid,lid,pctId,pct,lbl){
  document.getElementById(pid).style.width=pct+'%';
  document.getElementById(lid).textContent=lbl;
  document.getElementById(pctId).textContent=Math.round(pct)+'%';
}
function showQRs(zid,color,opts,fn){
  const z=document.getElementById(zid);z.innerHTML='';
  if(!opts)return;
  opts.forEach(o=>{
    const b=document.createElement('button');b.className='qr '+color;b.textContent=o;
    b.onclick=()=>{z.innerHTML='';fn(o);};z.appendChild(b);
  });
}
async function callAPI(history,system){
  const res=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:history,system})});
  const data=await res.json();
  if(!res.ok)throw new Error(data.error||'HTTP '+res.status);
  if(!data.text)throw new Error('Empty response');
  return data.text;
}

  results.innerHTML='';
  const msg=document.createElement('div');
  msg.className='ov-msg assistant';msg.textContent=firstResponse;
  results.appendChild(msg);
  const actions=document.getElementById('ov-actions');
  actions.innerHTML='';
  const row=document.createElement('div');row.className='ov-actions-row';
  paths.forEach((p,i)=>{
    const btn=document.createElement('button');
    btn.className='ov-btn '+color;
    btn.textContent='Tell me more about '+p;
    btn.onclick=()=>ovAsk('Tell me more about '+p,history,system,color);
    row.appendChild(btn);
  });
  actions.appendChild(row);
  const inp=document.getElementById('ov-inp');
  inp.className=color;
  document.getElementById('ov-sbtn').className='ov-send '+color;
  document.getElementById('overlay').classList.add('open');
  window._ovHistory=history;
  window._ovSystem=system;
  window._ovColor=color;
}

function closeOverlay(){
  document.getElementById('overlay').classList.remove('open');
}

async function ovAsk(text,history,system,color){
  if(!text.trim()||ovBusy)return;
  ovBusy=true;
  document.getElementById('ov-sbtn').disabled=true;
  document.getElementById('ov-inp').value='';
  const results=document.getElementById('ov-results');
  const uMsg=document.createElement('div');
  uMsg.className='ov-msg user-q'+(color==='blue'?' blue':'');
  uMsg.textContent=text;results.appendChild(uMsg);
  results.scrollTop=results.scrollHeight;
  const tWrap=document.createElement('div');tWrap.className='ov-msg typing-wrap';tWrap.id='ov-typing';
  tWrap.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  results.appendChild(tWrap);results.scrollTop=results.scrollHeight;
  try{
    history.push({role:'user',content:text});
    const reply=await callAPI(history,system);
    history.push({role:'assistant',content:reply});
    tWrap.remove();
    const aMsg=document.createElement('div');aMsg.className='ov-msg assistant';aMsg.textContent=reply;
    results.appendChild(aMsg);results.scrollTop=results.scrollHeight;
  }catch(e){
    tWrap.remove();
    const eMsg=document.createElement('div');eMsg.className='ov-msg assistant';eMsg.textContent='Error: '+e.message;
    results.appendChild(eMsg);
  }
  ovBusy=false;document.getElementById('ov-sbtn').disabled=false;
}

function ovSend(){
  const text=document.getElementById('ov-inp').value.trim();
  if(text&&window._ovHistory)ovAsk(text,window._ovHistory,window._ovSystem,window._ovColor);
}

function savePDF(){
  const title=document.getElementById('ov-title-main').textContent;
  const summary=document.getElementById('ov-summary').textContent;
  const msgs=[...document.querySelectorAll('.ov-msg')].map(m=>m.textContent).join('\n\n---\n\n');
  const content=title+'\n\ncareerrahnuma.com\n\n'+summary+'\n\n'+msgs;
  const blob=new Blob([content],{type:'text/plain'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);
  a.download='rahnuma-results.txt';a.click();
}

/* ── EXTRACT PATHS FROM RESPONSE ── */
function extractPaths(text,mode){
  if(mode==='career'){
    const matches=text.match(/PATH\s*\d+[:\s]+([^\n]+)/gi);
    if(matches&&matches.length>=2)return matches.slice(0,3).map(m=>m.replace(/PATH\s*\d+[:\s]+/i,'').trim().substring(0,40));
    return['Path 1','Path 2','Path 3'];
  } else {
    const lines=text.split('\n').filter(l=>l.trim().length>10&&l.trim()===l.trim().toUpperCase()&&l.length<80);
    if(lines.length>=2)return lines.slice(0,3).map(l=>l.trim().substring(0,40));
    return['Scholarship 1','Scholarship 2','Scholarship 3'];
  }
}

function buildSummary(text,mode){
  if(mode==='career'){
    const paths=extractPaths(text,mode);
    return paths.join(' · ');
  } else {
    const paths=extractPaths(text,mode);
    return paths.join(' · ');
  }
}

/* ── CAREER COACH ── */
async function cGo(text){
  if(!text.trim()||cBusy)return;
  cBusy=true;document.getElementById('c-sbtn').disabled=true;
  document.getElementById('c-inp').value='';document.getElementById('c-qrs').innerHTML='';
  addBubble('c-chat','user-green',text);
  if(cStep<C_STEPS.length){cProfile[C_STEPS[cStep].key]=text;cStep++;}
  if(cStep<C_STEPS.length){
    await new Promise(r=>setTimeout(r,350));
    const s=C_STEPS[cStep];setProg('c-prog','c-plabel','c-ppct',s.prog,s.label);
    addBubble('c-chat','bot',s.q);showQRs('c-qrs','green',s.qr,cGo);
  } else {
    const first=(cStep===C_STEPS.length);if(first)cStep++;
    setProg('c-prog','c-plabel','c-ppct',100,'Your career paths');
    addTyping('c-chat','c-typing');
    if(first){fetch(CAREER_SHEET,{method:'POST',mode:'no-cors',headers:{'Content-Type':'application/json'},body:JSON.stringify({degree:cProfile.degree,strengths:cProfile.strengths,constraint:cProfile.constraint,energy:cProfile.energy,income:cProfile.income})});}
    const payload=first?`User profile:\n• Degree: ${cProfile.degree}\n• Strengths: ${cProfile.strengths}\n• Constraint: ${cProfile.constraint}\n• Work preference: ${cProfile.energy}\n• Income target: ${cProfile.income}\n\nGive 3 specific career paths for Pakistan. For each: day-to-day reality, entry salary PKR/month, where to find jobs in Pakistan, one free resource, one "start this week" action. Be specific and warm. Use CAPS for PATH 1, PATH 2, PATH 3 headers.`:text;
    try{
      cHistory.push({role:'user',content:payload});
      const reply=await callAPI(cHistory,C_SYSTEM);
      cHistory.push({role:'assistant',content:reply});
      rmTyping('c-typing');
      if(first){
        const paths=extractPaths(reply,'career');
        const summary=buildSummary(reply,'career');
        openOverlay('career',summary,reply,paths,[...cHistory],C_SYSTEM);
      } else {
        addBubble('c-chat','bot',reply);
      }
    }catch(e){rmTyping('c-typing');addBubble('c-chat','err','Error: '+e.message+'\n\nRefresh and try again.');}
  }
  cBusy=false;document.getElementById('c-sbtn').disabled=false;
}
function cSend(){cGo(document.getElementById('c-inp').value.trim());}
